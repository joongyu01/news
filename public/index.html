<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>일일언론동향 검토</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#16181d; --dim:#6b7280; --line:#e3e6ea;
    --brand:#1a5490; --danger:#c62828; --danger-bg:#fdf1f1; --ok:#1b7a3d;
    --radius:10px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14161a; --card:#1d2026; --ink:#e8eaed; --dim:#9aa0a6; --line:#2c3038;
      --brand:#79aede; --danger:#ef9a9a; --danger-bg:#2a1d1d; --ok:#81c995;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:780px;margin:0 auto;padding:16px}
  button{font:inherit;cursor:pointer}

  /* ---- 로그인 ---- */
  #login{max-width:330px;margin:14vh auto;padding:28px 24px;background:var(--card);
         border:1px solid var(--line);border-radius:var(--radius);text-align:center}
  #login h1{font-size:17px;margin:0 0 4px}
  #login p{color:var(--dim);font-size:13px;margin:0 0 20px}
  #pin{width:100%;padding:13px;font-size:22px;letter-spacing:.5em;text-align:center;
       border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  #login button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:8px;
                background:var(--brand);color:#fff;font-weight:600}
  .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}

  /* ---- 헤더 ---- */
  header{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
         padding:16px 18px;margin-bottom:14px}
  header h1{font-size:17px;margin:0 0 3px}
  .sub{color:var(--dim);font-size:12.5px}
  .market{margin-top:11px;padding:9px 12px;background:var(--bg);border-radius:7px;
          font-size:13px;font-variant-numeric:tabular-nums}
  .riskbar{margin-top:9px;padding:9px 12px;background:var(--danger-bg);color:var(--danger);
           border-radius:7px;font-size:13px;font-weight:600}
  .datebar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .datebar input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;
                 background:var(--bg);color:var(--ink);font-size:13px}
  .ghost{padding:7px 12px;border:1px solid var(--line);border-radius:7px;
         background:var(--bg);color:var(--ink);font-size:13px}
  .filters{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
           padding:16px;margin-bottom:14px}
  .filters h2{font-size:15px;margin:0 0 10px}
  .searchbar{display:flex;gap:8px;flex-wrap:wrap}
  .searchbar input,.searchbar select{font:inherit;padding:9px 10px;border:1px solid var(--line);
      border-radius:7px;background:var(--bg);color:var(--ink);min-width:0}
  .searchbar input{flex:1 1 230px}
  .views{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
  .views button[aria-pressed="true"]{background:var(--brand);color:var(--card);border-color:var(--brand)}
  .result-count{font-size:13px;color:var(--dim);margin:0 0 10px}
  .badge{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11px;
         margin:0 5px 4px 0;background:var(--bg);color:var(--dim)}
  .badge.selected{color:var(--ok)}
  .badge.excluded{color:var(--danger)}
  .duplicate-mark{flex:0 0 24px;text-align:center;color:var(--dim)}
  .meta a{color:var(--brand)}
  .pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:14px 0 22px}
  button:disabled{cursor:default;opacity:.45}

  /* ---- 섹터 ---- */
  section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
          margin-bottom:12px;overflow:hidden}
  section h2{font-size:14px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);
             color:var(--brand);display:flex;justify-content:space-between;align-items:center}
  .count{color:var(--dim);font-weight:400;font-size:12px}

  .item{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line);
        align-items:flex-start}
  .item:last-child{border-bottom:0}
  .item.off .t{text-decoration:line-through;color:var(--dim)}
  .item.off .meta{opacity:.5}
  .item.over .t{color:var(--dim)}
  .tog{flex:0 0 auto;width:24px;height:24px;margin-top:2px;border-radius:6px;
       border:1.5px solid var(--line);background:var(--bg);color:var(--ok);
       display:grid;place-items:center;font-size:14px;line-height:1;padding:0}
  .item.off .tog{color:var(--danger)}
  .body{min-width:0;flex:1}
  .t{font-size:14.5px;word-break:break-word}
  .t a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
  .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .tag{display:inline-block;background:var(--danger-bg);color:var(--danger);
       border-radius:4px;padding:1px 6px;font-size:11px;margin-right:4px}
  .cut{background:var(--bg);color:var(--dim);font-size:12px;padding:8px 16px;
       border-top:1px dashed var(--line)}

  /* ---- 미리보기 ---- */
  .preview{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
           padding:16px;margin-bottom:24px}
  .preview h2{font-size:14px;margin:0 0 10px;color:var(--brand)}
  pre{margin:0;padding:13px;background:var(--bg);border-radius:7px;white-space:pre-wrap;
      word-break:break-word;font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;
      max-height:340px;overflow:auto}
  .copy{margin-top:10px;width:100%;padding:12px;border:0;border-radius:8px;
        background:var(--brand);color:#fff;font-weight:600}

  /* ---- 저장 상태 ---- */
  #status{position:fixed;left:50%;transform:translateX(-50%);
          bottom:calc(16px + env(safe-area-inset-bottom));
          background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;
          font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  #status.show{opacity:.94}
  .empty{padding:40px 16px;text-align:center;color:var(--dim);font-size:14px}
</style>
</head>
<body>

<div id="login" hidden>
  <h1>일일언론동향 검토</h1>
  <p>PIN을 입력해 주세요</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off"
         maxlength="8" placeholder="····">
  <button id="loginBtn">확인</button>
  <div class="err" id="loginErr"></div>
</div>

<div class="wrap" id="app" hidden></div>
<div id="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { date: "", data: null, excluded: new Set(), dirty: false,
                view: "all", query: "", sector: "all", page: 1 };
const PAGE_SIZE = 40;
let saveTimer = null;

// ---------------------------------------------------------------- 공통
function toast(msg, ms = 1800) {
  const el = $("status");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), ms);
}

async function api(path, options = {}) {
  const resp = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  let body = {};
  try { body = await resp.json(); } catch { /* 본문 없는 응답 */ }
  if (!resp.ok) throw Object.assign(new Error(body.error || `오류 ${resp.status}`),
                                    { status: resp.status, body });
  return body;
}

// ---------------------------------------------------------------- 로그인
async function login() {
  const pin = $("pin").value.trim();
  if (!pin) return;
  $("loginErr").textContent = "";
  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "확인 중…";
  try {
    await api("/api/session", { method: "POST", body: JSON.stringify({ pin }) });
    $("login").hidden = true;
    await load(state.date);
  } catch (err) {
    $("loginErr").textContent = err.message;
    $("pin").value = "";
    $("pin").focus();
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "확인";
  }
}

function showLogin() {
  $("app").hidden = true;
  $("login").hidden = false;
  $("pin").focus();
}

// ---------------------------------------------------------------- 불러오기
async function load(date) {
  try {
    const query = date ? `?date=${encodeURIComponent(date)}` : "";
    state.data = await api(`/api/draft${query}`);
    state.date = state.data.date;
    state.excluded = new Set(state.data.excluded);
    state.page = 1;
    if (!(state.data.sectors || []).some((s) => s.id === state.sector)) state.sector = "all";
    $("login").hidden = true;
    $("app").hidden = false;
    render();
  } catch (err) {
    if (err.status === 401) return showLogin();
    if (err.status === 404) {
      state.data = null;
      state.date = date || (err.body && err.body.date) || "";
      $("login").hidden = true;
      $("app").hidden = false;
      renderEmpty(err.message);
      return;
    }
    $("app").hidden = false;
    $("app").innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
  }
}

// ---------------------------------------------------------------- 저장
function scheduleSave() {
  state.dirty = true;
  clearTimeout(saveTimer);
  toast("저장 대기 중…", 1200);
  // 연속으로 여러 건을 누르는 게 보통이라, 멈춘 뒤에 한 번만 커밋합니다.
  saveTimer = setTimeout(save, 1200);
}

async function save() {
  if (!state.dirty || !state.data) return;
  try {
    const result = await api("/api/exclusions", {
      method: "PUT",
      body: JSON.stringify({ date: state.date, excluded: [...state.excluded] }),
    });
    state.dirty = false;
    toast(result.count ? `저장됨 · ${result.count}건 제외` : "저장됨");
  } catch (err) {
    if (err.status === 401) return showLogin();
    toast(`저장 실패 — ${err.message}`, 4000);
  }
}

// 탭을 닫거나 화면을 벗어날 때 미저장분이 남지 않도록
addEventListener("visibilitychange", () => { if (document.hidden) { clearTimeout(saveTimer); save(); } });

// ---------------------------------------------------------------- 그리기
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function titleLine(date) {
  const [y, m, d] = date.split("-");
  return `한국석유관리원 ${y.slice(2)}년 ${+m}월 ${+d}일 일일언론동향`;
}

function quoteText(q) {
  const v = Number(q.value).toLocaleString("en-US",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (q.change_pct === null || q.change_pct === undefined) return `${q.label} ${v}${q.unit || ""}`;
  const arrow = q.change_pct > 0 ? "▲" : q.change_pct < 0 ? "▼" : "-";
  return `${q.label} ${v}${q.unit || ""} ${arrow}${Math.abs(q.change_pct).toFixed(1)}%`;
}

function marketLine() {
  return (state.data.market || []).map(quoteText).join("  |  ");
}

/** 제외되지 않고 섹터 상한 안에 드는 기사들 — 실제로 발송될 목록. */
function kept(sector) {
  if (state.data.analysis?.version === 1) {
    const ids = new Set(visibleIssues().flatMap((i) => i.article_ids));
    return sector.articles.filter((a) => ids.has(a.id));
  }
  return sector.articles
    .filter((a) => !state.excluded.has(a.id))
    .slice(0, sector.limit || 99);
}

function riskKept() {
  return (state.data.sectors || [])
    .flatMap((s) => kept(s))
    .filter((a) => a.risk && a.risk.length);
}

function riskSummary() {
  if (state.data.analysis?.version === 1) return "";
  const risky = riskKept();
  if (!risky.length) return "";
  const kws = [];
  risky.forEach((a) => a.risk.forEach((k) => { if (!kws.includes(k)) kws.push(k); }));
  return `⚠️ 주의 ${risky.length}건 — ${kws.slice(0, 6).join(", ")}`;
}

/** 발송될 평문. scripts/render.py 의 render_plain 과 같은 결과를 냅니다. */
function plainText() {
  if (state.data.analysis?.version === 1) return analysisText();
  const out = [titleLine(state.date), ""];
  if (state.data.fallback_notice) out.push(state.data.fallback_notice, "");
  const mk = marketLine();
  if (mk) out.push(mk, "");
  const rs = riskSummary();
  if (rs) out.push(rs, "");
  for (const sector of state.data.sectors || []) {
    const items = kept(sector);
    if (!items.length) continue;
    out.push(`[${sector.title}]`);
    items.forEach((a, i) => {
      const mark = a.risk && a.risk.length ? "⚠️ " : "";
      const dup = a.duplicates && a.duplicates.length ? ` (외 ${a.duplicates.length}건)` : "";
      out.push(`${i + 1}. ${mark}${a.title}${dup} / ${a.source}`);
      out.push(a.url);
    });
    out.push("");
  }
  return out.join("\n").replace(/\s+$/, "") + "\n";
}

function visibleIssues() {
  const ids = new Set((state.data.sectors || []).flatMap((s) => s.articles.map((a) => a.id)));
  return (state.data.analysis?.issues || []).filter((i) => i.article_ids?.length &&
    i.article_ids.every((id) => ids.has(id) && !state.excluded.has(id)));
}

function analysisText() {
  const out = [titleLine(state.date), "", "[AI 종합 분석]", ""];
  const issues = visibleIssues();
  const articles = new Map((state.data.sectors || []).flatMap((s) => s.articles.map((a) => [a.id, a])));
  issues.forEach((issue, n) => {
    out.push(`${n + 1}. ${issue.title}`, `핵심: ${issue.summary}`, `새로운 점: ${issue.change}`, `업무 관련성: ${issue.impact}`);
    issue.article_ids.forEach((id) => {
      const a = articles.get(id);
      out.push(`근거: ${a.title} / ${a.source}`, a.url);
    });
    out.push("");
  });
  if (!issues.length) out.push("오늘 발송할 주요 새 이슈가 없습니다.", "");
  out.push("수집된 제목·매체 요약을 바탕으로 작성한 AI 분석입니다. 중요 사실은 원문 확인이 필요합니다.");
  return out.join("\n").replace(/\s+$/, "") + "\n";
}

function renderEmpty(message) {
  $("app").innerHTML = `
    <header>
      <h1>일일언론동향 검토</h1>
      <div class="sub">${escapeHtml(state.date || "")}</div>
      ${dateBar()}
    </header>
    <div class="empty">${escapeHtml(message)}<br><br>
      15분마다 수집한 기사를 매일 08:00에 AI가 종합 분석합니다.</div>`;
  bindDateBar();
}

function dateBar() {
  return `<div class="datebar">
      <input type="date" id="dateInput" value="${escapeHtml(state.date || "")}">
      <button class="ghost" id="prevDay">◀ 이전날</button>
      <button class="ghost" id="nextDay">다음날 ▶</button>
      <button class="ghost" id="logout" style="margin-left:auto">로그아웃</button>
    </div>`;
}

// 열람용 목록은 발송 목록(kept/plainText)과 독립입니다.
// 이미 저장된 중복 기사도 각각 원문을 열 수 있게 펼칩니다.
function reviewRows() {
  return (state.data.sectors || []).flatMap((sector) => {
    const selected = new Set(kept(sector).map((a) => a.id));
    return sector.articles.flatMap((a) => [
      { article: a, sector, status: state.excluded.has(a.id) ? "excluded" :
          selected.has(a.id) ? "selected" : "overflow" },
      ...(a.duplicates || []).map((article) => ({ article, sector, status: "duplicate", parent: a })),
    ]);
  });
}

function filteredRows(rows = reviewRows()) {
  const words = state.query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
  return rows.filter((row) => {
    if (state.sector !== "all" && row.sector.id !== state.sector) return false;
    if (state.view === "unsent" && row.status === "selected") return false;
    if (!["all", "unsent"].includes(state.view) && row.status !== state.view) return false;
    const searchable = [row.article.title, row.article.source, row.article.summary]
      .filter(Boolean).join(" ").toLocaleLowerCase();
    return words.every((word) => searchable.includes(word));
  });
}

function articleLink(article, label = article.title) {
  // 저장된 외부 기사도 신뢰하지 않습니다. 웹 원문 링크만 열 수 있습니다.
  let safe = false;
  try { safe = ["https:", "http:"].includes(new URL(article.url).protocol); } catch {}
  return safe ? `<a href="${escapeHtml(article.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`
    : escapeHtml(label);
}

function renderRow(row) {
  const { article: a, status, parent } = row;
  const labels = { selected: "발송 예정", overflow: "상한 초과", excluded: "담당자 제외", duplicate: "중복 묶음" };
  if (state.data.analysis?.version === 1) labels.overflow = "분석 미선정";
  const off = status === "excluded";
  const tags = (a.risk || []).map((k) => `<span class="tag">${escapeHtml(k)}</span>`).join("");
  const control = parent ? '<span class="duplicate-mark" aria-hidden="true">↳</span>' :
    `<button class="tog" data-toggle-id="${escapeHtml(a.id)}" aria-label="${off ? "다시 포함" : "제외"}: ${escapeHtml(a.title)}">${off ? "✕" : "✓"}</button>`;
  const meta = [a.source || "매체 미상", a.published || (parent ? "개별 보도 시각 미저장" : "시각 미상")];
  if (parent) meta.push("대표 기사에 묶여 별도 발송되지 않음");
  return `<div class="item ${off ? "off" : ""}">
      ${control}<div class="body">
        <span class="badge ${status}">${labels[status]}</span>
        <div class="t">${tags}${articleLink(a)}</div>
        <div class="meta">${meta.map(escapeHtml).join(" · ")}${parent ? ` · ${articleLink(parent, "대표 기사 보기")}` : ""}</div>
      </div></div>`;
}

function renderResults() {
  const rows = filteredRows();
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  state.page = Math.min(Math.max(1, state.page), pages);
  const start = (state.page - 1) * PAGE_SIZE;
  const page = rows.slice(start, start + PAGE_SIZE);
  const summary = rows.length ? `${rows.length}건 중 ${start + 1}–${start + page.length}건 표시` : "조건에 맞는 기사가 없습니다.";
  let html = `<p class="result-count" role="status">${summary}</p>`;
  for (const sector of state.data.sectors || []) {
    const items = page.filter((row) => row.sector.id === sector.id);
    if (!items.length) continue;
    html += `<section><h2>${escapeHtml(sector.title)}<span class="count">이 페이지 ${items.length}건</span></h2>`;
    html += items.map(renderRow).join("") + "</section>";
  }
  if (!rows.length) html += '<div class="empty">검색어 또는 분야·표시 조건을 바꿔주세요.</div>';
  html += `<div class="pager"><button class="ghost" id="prevPage" ${state.page === 1 ? "disabled" : ""}>이전 페이지</button>
      <span>${state.page} / ${pages}</span>
      <button class="ghost" id="nextPage" ${state.page === pages ? "disabled" : ""}>다음 페이지</button></div>`;
  $("articleResults").innerHTML = html;
  $("articleResults").querySelectorAll("[data-toggle-id]").forEach((button) => {
    button.onclick = () => {
      const id = button.dataset.toggleId;
      state.excluded.has(id) ? state.excluded.delete(id) : state.excluded.add(id);
      scheduleSave();
      render();
    };
  });
  for (const [id, step] of [["prevPage", -1], ["nextPage", 1]]) {
    $(id).onclick = () => {
      state.page += step;
      renderResults();
      $("articleResults").scrollIntoView({ block: "start" });
    };
  }
}

function render() {
  const d = state.data;
  const totalKept = (d.sectors || []).reduce((n, s) => n + kept(s).length, 0);
  const mk = marketLine();
  const rs = riskSummary();
  const rows = reviewRows();
  const counts = Object.fromEntries(["selected", "overflow", "excluded", "duplicate"]
    .map((status) => [status, rows.filter((row) => row.status === status).length]));
  const views = [["all", "전체", rows.length], ["selected", "발송 예정", counts.selected],
    ["unsent", "미발송", rows.length - counts.selected], ["overflow", d.analysis?.version === 1 ? "분석 미선정" : "상한 초과", counts.overflow],
    ["excluded", "담당자 제외", counts.excluded], ["duplicate", "중복 묶음", counts.duplicate]];

  let html = `
    <header>
      <h1>${escapeHtml(titleLine(state.date))}</h1>
      <div class="sub">수집 ${escapeHtml(d.generated_at || "-")} ·
        저장된 기사 ${rows.length}건 · <b>${totalKept}건 발송 예정</b></div>
      ${mk ? `<div class="market">${escapeHtml(mk)}</div>` : ""}
      ${rs ? `<div class="riskbar">${escapeHtml(rs)}</div>` : ""}
      ${dateBar()}
    </header>
    ${d.analysis?.version === 1 ? '<p>AI가 고른 핵심 이슈만 발송합니다. 근거 기사를 제외하면 해당 이슈 전체가 빠집니다. 미선정 기사는 자동 승격되지 않습니다.</p>' : ''}
    <div class="filters">
      <h2>수집 기사 찾아보기</h2>
      <div class="searchbar">
        <input type="search" id="articleSearch" aria-label="기사 검색" placeholder="제목·매체·요약 검색" value="${escapeHtml(state.query)}">
        <select id="sectorFilter" aria-label="기사 분야"><option value="all">전체 분야</option>
          ${(d.sectors || []).map((s) => `<option value="${escapeHtml(s.id)}" ${state.sector === s.id ? "selected" : ""}>${escapeHtml(s.title)}</option>`).join("")}</select>
        <button class="ghost" id="resetFilters">조건 초기화</button>
      </div>
      <div class="views" role="group" aria-label="기사 표시 범위">
        ${views.map(([view, label, count]) => `<button class="ghost" data-view="${view}" aria-pressed="${state.view === view}">${label} ${count}</button>`).join("")}
      </div>
      <div class="sub">중복으로 묶인 다른 매체 기사도 원문을 볼 수 있습니다. 검색·필터는 발송 목록에 영향을 주지 않습니다.<br>
        상한 초과 기사는 같은 분야의 앞선 기사를 제외하면 발송 목록에 올라옵니다.</div>
    </div>
    <div id="articleResults"></div>`;

  html += `
    <div class="preview">
      <h2>카카오톡에 붙여넣을 내용</h2>
      <pre id="pv">${escapeHtml(plainText())}</pre>
      <button class="copy" id="copyBtn">전체 복사</button>
    </div>`;

  $("app").innerHTML = html;
  renderResults();
  bind();
}

// ---------------------------------------------------------------- 이벤트
function bindDateBar() {
  const input = $("dateInput");
  if (input) input.onchange = () => load(input.value);
  const shift = (days) => {
    const dt = new Date(`${state.date}T00:00:00`);
    dt.setDate(dt.getDate() + days);
    load(dt.toISOString().slice(0, 10));
  };
  if ($("prevDay")) $("prevDay").onclick = () => shift(-1);
  if ($("nextDay")) $("nextDay").onclick = () => shift(1);
  if ($("logout")) $("logout").onclick = async () => {
    await fetch("/api/session", { method: "DELETE" });
    location.reload();
  };
}

function bind() {
  bindDateBar();

  $("articleSearch").oninput = (event) => {
    state.query = event.target.value;
    state.page = 1;
    renderResults();
  };
  $("sectorFilter").onchange = (event) => {
    state.sector = event.target.value;
    state.page = 1;
    renderResults();
  };
  $("resetFilters").onclick = () => {
    Object.assign(state, { view: "all", query: "", sector: "all", page: 1 });
    render();
    $("articleSearch").focus();
  };
  $("app").querySelectorAll("[data-view]").forEach((button) => {
    button.onclick = () => {
      state.view = button.dataset.view;
      state.page = 1;
      render();
    };
  });

  $("copyBtn").onclick = async () => {
    const text = $("pv").textContent;
    try {
      await navigator.clipboard.writeText(text);
      toast("복사했습니다 — 카카오톡에 붙여넣으세요");
    } catch {
      // 구형 브라우저·비보안 컨텍스트 대비
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast("복사했습니다");
    }
  };
}

// ---------------------------------------------------------------- 시작
$("loginBtn").onclick = login;
$("pin").onkeydown = (e) => { if (e.key === "Enter") login(); };
load(new URLSearchParams(location.search).get("date") || "");
</script>
</body>
</html>
