# 금요일 08:30 (KST) 그 주에 나간 동향을 한 장으로 요약해 보냅니다.
name: 주간 롤업

on:
  schedule:
    - cron: "30 23 * * 4"      # 목 23:30 UTC = 금 08:30 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "실제 발송 없이 결과만 로그로 확인"
        type: boolean
        default: false

concurrency:
  group: news-weekly

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: KST 휴식 시간 확인 (00:00~05:16)
        id: hours
        shell: bash
        run: |
          minute=$((10#$(TZ=Asia/Seoul date +%H) * 60 + 10#$(TZ=Asia/Seoul date +%M)))
          if [ "$minute" -lt 317 ]; then
            echo "awake=false" >> "$GITHUB_OUTPUT"
            echo "휴식 시간: 수집·분석·발송 생략"
          else
            echo "awake=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.hours.outputs.awake == 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.hours.outputs.awake == 'true' }}
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
        if: ${{ steps.hours.outputs.awake == 'true' }}
      - name: 주간 요약 발송
        if: ${{ steps.hours.outputs.awake == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m scripts.weekly --dry-run
          else
            python -m scripts.weekly
          fi
