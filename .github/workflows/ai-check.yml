name: AI API 진단
on:
  workflow_dispatch:
    inputs:
      compare_format:
        description: "JSON 옵션 비교 (총 4회, 뉴스 발송 없음)"
        type: boolean
        default: false
      compare_routes:
        description: "3.8 호출 경로 비교 (키당 2회, 뉴스 발송 없음)"
        type: boolean
        default: false
concurrency:
  group: news-urgent-alerts
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: API 형식 진단 (뉴스 발송 없음)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          GEMINI_MODEL: gemini-3.8-flash
          COMPARE_ROUTES: ${{ inputs.compare_routes }}
          COMPARE_FORMAT: ${{ inputs.compare_format }}
        run: |
          if [ "$COMPARE_ROUTES" = "true" ] || [ "$COMPARE_FORMAT" = "true" ]; then
            python -m scripts.check_ai_routes
          else
            python -m scripts.check_ai
          fi
