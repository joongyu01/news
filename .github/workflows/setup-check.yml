# Secret 을 넣은 뒤 이걸 한 번 돌리면 어디까지 됐는지 바로 알 수 있습니다.
# 다음 날 아침을 기다렸다가 실패를 확인하는 대신 그 자리에서 확인하려는 것입니다.
#
# Actions 탭 > 설정 확인 > Run workflow
name: 설정 확인

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: "텔레그램·이메일로 실제 시험 메시지를 보냅니다"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 설정 점검
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REVIEW_URL: ${{ vars.REVIEW_URL }}
        run: |
          if [ "${{ inputs.send_test }}" = "false" ]; then
            python -m scripts.setup_check
          else
            python -m scripts.setup_check --send-test
          fi
