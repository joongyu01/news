# 매일 05:17 KST 예약. 최근 약 2시간대 지연을 감안해 08시 전 수신 목표.
name: 조간 AI 분석·발송

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "AI 분석 결과만 확인 (조간 저장·발송 없음, 사용량은 기록)"
        type: boolean
        default: false

concurrency:
  group: news-urgent-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_FREE_TIER_CONFIRMED: ${{ vars.GROQ_FREE_TIER_CONFIRMED }}
      GEMINI_MODEL: gemini-3.8-flash
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 누적 기사 조간 분석
        id: analyze
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--no-notify)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run --refresh-analysis)
          python -m scripts.morning "${args[@]}"
      - name: 조간 발송
        id: dispatch
        if: ${{ inputs.dry_run != true }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m scripts.dispatch --skip-sent
      - name: 실패 알림
        if: ${{ failure() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m scripts.failure --stage morning
      - name: 조간 기록 커밋
        if: ${{ success() && inputs.dry_run != true }}
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drafts archive
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "조간: $(TZ=Asia/Seoul date +%Y-%m-%d) AI 분석·발송"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 5))
          done
          exit 1
