name: 일일 운영 요약 (소유자 개인톡)
on:
  schedule:
    - cron: '0 11 * * *' # 20:00 KST, Actions 예약 지연 가능
  workflow_dispatch:
    inputs:
      dry_run:
        description: '발송·저장 없이 집계 확인'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: news-urgent-alerts
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: KST 휴식 시간 확인 (00:00~05:16)
        id: hours
        shell: bash
        run: |
          minute=$((10#$(TZ=Asia/Seoul date +%H) * 60 + 10#$(TZ=Asia/Seoul date +%M)))
          if [ "$minute" -lt 317 ]; then
            echo "awake=false" >> "$GITHUB_OUTPUT"
            echo "휴식 시간: 수집·분석·발송 생략"
          else
            echo "awake=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.hours.outputs.awake == 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.hours.outputs.awake == 'true' }}
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -r requirements.txt
        if: ${{ steps.hours.outputs.awake == 'true' }}
      - name: 소유자 운영 요약
        if: ${{ steps.hours.outputs.awake == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python -m scripts.daily_report "${args[@]}"
