name: 기사 수집·누적 저장

on:
  schedule:
    # 수집만 24시간 15분 간격. AI 선별은 screening.yml에서 별도 실행.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "수집만 확인 (저장 없음)"
        type: boolean
        default: false

concurrency:
  group: news-urgent-alerts
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: 기사 수집·누적 저장 (AI 호출 없음)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--collect-only)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python -m scripts.alerts "${args[@]}"
      - name: GitHub 사용량·운영 기록 갱신
        if: ${{ !cancelled() && inputs.dry_run != true }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scripts.github_usage
