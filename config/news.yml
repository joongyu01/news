# 한국석유관리원 일일언론동향 수집 설정
#
# 이 파일만 고치면 수집 대상과 분류 기준이 바뀝니다. 코드는 건드릴 필요 없습니다.
# 수정 후 push 하면 다음 날 아침부터 반영됩니다.

# 섹터는 위에서부터 순서대로 판정합니다. 먼저 걸리는 섹터로 배정됩니다.
# 따라서 좁은 섹터(석유관리원)를 위에, 넓은 섹터(에너지)를 아래에 둡니다.
sectors:
  - id: kpetro
    title: 석유관리원 뉴스
    # 아래 단어가 제목/본문에 있으면 무조건 이 섹터
    must:
      - 한국석유관리원
      - 석유관리원
    queries:
      - 한국석유관리원
      - 석유관리원

  - id: public
    title: 공공기관 뉴스
    any:
      - 공공기관
      - 공기업
      - 준정부기관
      - 경영평가
      - 한국석유공사
      - 한국가스공사
      - 에너지자원공사
      - 에너지 자원 공사
      - 석유·가스공사
      - 가스·석유공사
      - 석유·가스公
      - 가스·석유公
      - 한국에너지공단
      - 한국전력
      - 발전공기업
      - 기관통합
      - 혁신계획
      - 방만경영
      - 임금피크
    queries:
      - 공공기관 경영평가
      - 공공기관 혁신
      - 한국석유공사
      - 한국가스공사
      - 한국에너지공단
      # 통합 관련 별칭·진행 경과를 별도로 수집합니다.
      - '((석유공사 OR 가스공사) (통합 OR 합병 OR 통폐합 OR 기능이관 OR 기능조정 OR 본사)) OR 에너지자원공사'

  - id: government
    title: 정부·정책 뉴스
    any:
      - 산업통상자원부
      - 기획재정부
      - 환경부
      - 국무회의
      - 국정감사
      - 입법예고
      - 시행령
      - 개정안
      - 법률안
      - 정부안
      - 예산안
      - 규제개혁
      - 세액공제
      - 정책
    queries:
      - 산업통상자원부 에너지
      - 석유사업법
      - 에너지 정책
      - 정부 에너지 대책

  - id: energy
    title: 에너지 뉴스
    # 마지막 섹터는 fallback 역할도 겸합니다.
    any:
      - 국제유가
      - 유가
      - 원유
      - 정유
      - 석유
      - 휘발유
      - 경유
      - 등유
      - LPG
      - 액화석유가스
      - 천연가스
      - 주유소
      - 최고가격제
      - 정제마진
      - 석유제품
      - SAF
      - 바이오디젤
      - 수소
      - 배럴
      - OPEC
      - 에너지시장감시단
      - 에너지 시장감시단
      - 에너지시장 감시단
      - 에너지 시장 감시단
      - 에너지·석유시장감시단
      - 에너지석유시장감시단
      - 석유시장감시단
      - 석유 시장감시단
      - 석유시장 감시단
      - 석유 시장 감시단
    queries:
      - 국제유가
      - 정유업계
      - 석유제품 가격
      - 휘발유 가격
      - 주유소
      - 석유 수급
      - LPG 가격
      - '"에너지시장감시단" OR "에너지 시장 감시단" OR "석유시장감시단" OR "석유 시장 감시단"'

# 이 단어가 걸린 기사는 최상단에 ⚠️ 로 따로 표시합니다.
# 기관이 언론 대응을 해야 할 수 있는 사안들입니다.
risk_keywords:
  - 가짜석유
  - 유사석유
  - 정량미달
  - 품질검사
  - 품질부적합
  - 불법유통
  - 면세유
  - 담합
  - 과징금
  - 국정감사
  - 감사원
  - 비리
  - 압수수색
  - 구속영장
  - 검찰
  - 고발
  - 제재
  - 특혜
  - 채용비리

# 제목에 이 단어가 있으면 수집 단계에서 아예 버립니다.
# (담당자가 매일 똑같은 걸 손으로 빼지 않도록)
blocklist:
  title_contains:
    - 부고
    - 인사말
    - 동정
    - 신간
    - 오늘의 운세
    - 포토뉴스
    - 종목토론
    - 코스피 마감
    - 코스닥 마감
  # 이 매체는 통째로 제외
  sources: []

# 한 섹터에 최대 몇 건까지 담을지. 기존 동향이 섹터당 1~5건이라 그에 맞춤.
limits:
  kpetro: 6
  public: 4
  government: 4
  energy: 6

# 몇 시간 이내 기사만 수집할지
lookback_hours: 26

# 해외 원문은 누적 저장 후 아침 분석에만 포함합니다.
foreign_queries:
  - '(oil OR LNG) (supply OR sanctions OR disruption) site:reuters.com'
  - '(oil OR fuel) (reserves OR release OR supply) (site:iea.org OR site:eia.gov)'
  - 'OPEC (output OR production OR cuts) site:reuters.com'
  - '(fuel OR diesel OR aviation) (standards OR regulation OR mandate) site:ec.europa.eu'
