# 제목만으로 보고 필요성이 높은 소식을 선별합니다. AI API를 호출하지 않습니다.
enabled: true
ai_screening: true
topics_delivery: daily
lookback_hours: 6
initial_lookback_minutes: 30
history_days: 7
max_history: 500
max_per_run: 3
similarity_threshold: 0.72
queries:
  - '석유관리원'
  - '(정유공장 OR 저유소 OR 송유관 OR 유조선) (화재 OR 폭발 OR 유출 OR 피격)'
  - '(주유소 OR LPG OR 가스충전소) (화재 OR 폭발 OR 누출)'
  - '(석유 OR 원유 OR LNG) (공급중단 OR 공급차질 OR 수출중단 OR 가동중단)'
  - '(호르무즈 OR 유조선) (봉쇄 OR 피격)'
  - '(비축유 OR 유류세 OR 최고가격제) (방출 OR 긴급 OR 시행 OR 확정)'
  - '(가짜석유 OR 면세유) (대규모 OR 전국 OR 구속)'
  - '"에너지시장감시단" OR "에너지 시장 감시단" OR "석유시장감시단" OR "석유 시장 감시단"'
  - '((석유공사 OR 가스공사) (통합 OR 합병 OR 통폐합 OR 기능이관 OR 기능조정 OR 본사)) OR 에너지자원공사'
# 관심 주제는 긴급성 필터와 분리합니다. 공식 부인·철회·검토 단계도 새 소식입니다.
topic_exclude_title: '기고|칼럼|사설|주가|테마주|종목토론'
topics:
  - id: energy_watchdog
    kind: topic
    label: 에너지시장감시단
    scope: '(?:에너지\s*(?:[·ㆍ・‧-]\s*)?(?:석유\s*)?|석유\s*)시장\s*감시단'
    trigger: '.'
    action: 조사·보고서·공식 입장과 원문 수치 확인 필요
  - id: oil_gas_integration
    kind: topic
    label: 석유공사·가스공사 통합
    scope: '(?:석유|가스)\s*(?:공사|公)|에너지\s*자원\s*공사'
    trigger: '통합(?!\s*(?:안전|관제|구매|예약|전산|정보|관리|시스템|방재|훈련|플랫폼|검색|공시|경영공시))|합병|통폐합|(?:기관|조직).*개편|기능\s*(?:조정|이관|재편)|에너지\s*자원\s*공사'
    action: 통합 추진·확정 여부, 법안·일정·본사·기능 이관과 이해관계자 입장 확인 필요
exclude_title: '모의|훈련|예방|캠페인|안전점검|안전 점검|무상.*점검|기고|칼럼|사설|기자수첩|전망|가능성|우려|가정한|주가|테마주|사실무근|오보|가짜뉴스|공급.*중단.*없|부인|정상화|봉쇄.*해제|회고|되짚|재조명|역사|다큐|영화|드라마|표창|수상|인터뷰|방출.*(?:안\s*해|않|없|반대|촉구|요구|검토)|봉쇄.*(?:촉구|요구|검토)|의 비밀'
rules:
  - id: agency
    label: 석유관리원 중대 이슈
    scope: '석유관리원'
    trigger: '압수수색|구속|기소|수사.*착수|고발|횡령|비리|정보.*유출|해킹|중대재해|사망|감사원.*(적발|통보)|기관.*통합|통합.*확정|폐지.*확정'
    action: 기관 관련 사실관계와 공식 입장 확인 필요
  - id: accident
    label: 석유·가스 시설 사고
    scope: '정유공장|정유시설|저유소|유조선|송유관|가스기지|석유화학.*공장|주유소|LPG|가스충전소|가스 충전소'
    trigger: '화재|폭발|누출|유출|피격'
    action: 발생 위치·인명 피해·공급 영향 확인 필요
  - id: supply
    label: 에너지 공급 차질
    scope: '석유|원유|휘발유|경유|정유|천연가스|LNG|LPG|호르무즈|유조선'
    trigger: '공급\s*중단|공급\s*차질|수출\s*중단|수출\s*금지|수입\s*중단|봉쇄|비상\s*사태|수급\s*경보|가동\s*중단'
    action: 국내 수급과 담당 업무 영향 확인 필요
  - id: policy
    label: 긴급 석유 정책
    scope: '석유|원유|휘발유|경유|유류세|비축유|최고가격제'
    trigger: '긴급.*(발표|시행|명령)|비축유.*방출|수급\s*경보|최고가격제.*(시행|발동|폐지)|유류세.*(인하|인상|환원).*확정'
    action: 시행 시점·적용 범위와 공식 발표 확인 필요
  - id: illegal
    label: 대규모 불법 석유 유통
    scope: '가짜석유|유사석유|불법.*석유|석유.*불법|면세유'
    trigger: '대규모.*(적발|유통)|전국.*적발|구속|조직.*적발|수백억|수천억'
    action: 피해 범위와 검사·단속 관련 사실관계 확인 필요
